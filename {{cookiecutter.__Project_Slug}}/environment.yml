name: mamba_{{cookiecutter.__project_slug}}
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python={{cookiecutter.python_ver}}
  - poetry
  - make
  - git
  - yq
{%- if cookiecutter.r_ver != "none" %}
  - r-base={{cookiecutter.r_ver}}
  - r-renv
  - r-irkernel
  - r-testthat
  - r-styler
  - r-lintr
  - r-devtools
  - r-pkgdown
  - r-roxygen2
  - r-rmarkdown
  - r-knitr
  - r-tidyverse
  - r-arrow
  - r-dplyr
  - r-data.table
  - r-s7
  - r-r6
  - r-fs
  - r-rlang
  - r-future
  - r-furrr
  - r-checkmate
  - r-glue
  - r-unglue
  - r-biocmanager
  - bioconductor-biocversion
  - c-compiler
  - cxx-compiler
  - cmake
  - pkg-config
  - libxml2
  - libcurl
  - openssl
  - zeromq
  - libuv
  - glpk
  - pandoc
  - libgit2
  - glib
  - harfbuzz
  - fribidi
  - freetype
  - libpng
  - libjpeg-turbo
{%- endif %}
