name: mamba_{{cookiecutter.__project_slug}}
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python={{cookiecutter.python_ver}}
  - poetry
  - make
  - git
  - yq
{%- if cookiecutter.r_ver != "none" %}
  - r-base={{cookiecutter.r_ver}}
  - r-renv
  - r-irkernel
  - r-testthat
  - r-styler
  - r-lintr
  - r-devtools
  - r-pkgdown
  - r-roxygen2
  - r-rmarkdown
  - r-knitr
  - r-biocmanager
  - bioconductor-biocversion
{%- endif %}
